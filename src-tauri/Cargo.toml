[package]
name = "arco"
version = "0.1.0"
description = "ARCO — professional visual design tool"
authors = ["ARCO"]
edition = "2021"
license = "MIT"

[lib]
name = "arco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
